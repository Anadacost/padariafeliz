
<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro | Pão & Felicidade</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #fff8ed; color: #3d2418; }
        .cadastro-box { max-width: 650px; margin: 40px auto; padding: 35px; background: white; border-radius: 15px; box-shadow: 0 4px 18px #0002; }
        .btn-brown { background: #5b2f21; color: white; }
        .btn-brown:hover { background: #713b2a; color: white; }
    </style>
</head>
<body>

<div class="container">
    <div class="cadastro-box">
        <h2 class="text-center">Pão & Felicidade</h2>
        <h4 class="text-center mb-4">Crie sua conta</h4>

        <form th:action="@{/cadastro}" method="post">

            <div class="mb-3">
                <label class="form-label">Nome completo</label>
                <input type="text" name="nome" class="form-control" required>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">CPF</label>
                    <input type="text" name="cpf" class="form-control" required>
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">Telefone</label>
                    <input type="tel" name="telefone" class="form-control" required>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">E-mail</label>
                <input type="email" name="email" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Endereço</label>
                <input type="text" name="endereco" class="form-control" required>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Bairro</label>
                    <input type="text" name="bairro" class="form-control" required>
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">Cidade</label>
                    <input type="text" name="cidade" class="form-control" required>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">Senha</label>
                <input type="password" name="senha" class="form-control" minlength="8" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Confirmar senha</label>
                <input type="password" name="confirmarSenha" class="form-control" minlength="8" required>
            </div>

            <button type="submit" class="btn btn-brown w-100">Criar cadastro</button>
        </form>

        <p class="text-center mt-4">
            Já possui uma conta?
            <a th:href="@{/login}">Faça login</a>
        </p>

        <div class="text-center">
            <a th:href="@{/}" class="text-decoration-none">Voltar ao início</a>
        </div>
    </div>
</div>

</body>
</html>
>
