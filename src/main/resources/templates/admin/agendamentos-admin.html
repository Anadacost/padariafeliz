
<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agendamentos | Pão & Felicidade</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body style="background-color: #fff8ed;">

<div th:replace="~{fragments/header :: cabecalho}"></div>
<div th:replace="~{fragments/mensagens :: mensagens}"></div>

<main class="container py-5">

  <h2 class="fw-bold mb-4" style="color: #5b2f21;">
    Gerenciar Agendamentos
  </h2>

  <div class="card shadow-sm border-0 p-4">

    <div class="table-responsive">

      <table class="table table-hover align-middle">

        <thead>
        <tr>
          <th>Número</th>
          <th>Cliente</th>
          <th>Data do agendamento</th>
          <th>Retirada</th>
          <th>Valor</th>
          <th>Status</th>
          <th>Decisão</th>
        </tr>
        </thead>

        <tbody>

        <tr th:each="agendamento : ${agendamentos}">

          <td th:text="${agendamento.id}"></td>

          <td th:text="${agendamento.cliente.nome}"></td>

          <td th:text="${#temporals.format(agendamento.dataAgendamento, 'dd/MM/yyyy HH:mm')}"></td>

          <td th:text="${#temporals.format(agendamento.dataRetirada, 'dd/MM/yyyy HH:mm')}"></td>

          <td th:text="${#numbers.formatCurrency(agendamento.valorTotal)}"></td>

          <td th:text="${agendamento.status}"></td>

          <td>
            <form th:action="@{/admin/agendamentos/status/{id}(id=${agendamento.id})}"
                  method="post">

              <button type="submit" name="status" value="ACEITO"
                      class="btn btn-sm btn-success mb-1">
                Aceitar
              </button>

              <button type="submit" name="status" value="RECUSADO"
                      class="btn btn-sm btn-danger mb-1">
                Recusar
              </button>

            </form>
          </td>

        </tr>

        <tr th:if="${#lists.isEmpty(agendamentos)}">
          <td colspan="7" class="text-center text-secondary">
            Nenhum agendamento encontrado.
          </td>
        </tr>

        </tbody>

      </table>

    </div>

  </div>

</main>

<div th:replace="~{fragments/footer :: rodape}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
