
<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Food to Save | Pão & Felicidade</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body style="background-color: #fff8ed;">

<div th:replace="~{fragments/header :: cabecalho}"></div>
<div th:replace="~{fragments/mensagens :: mensagens}"></div>

<main class="container py-5">

  <h2 class="fw-bold mb-2" style="color: #5b2f21;">
    Gerenciar Food to Save
  </h2>

  <p class="text-secondary mb-4">
    Cadastre e controle as sacolas surpresa disponíveis para venda.
  </p>

  <div class="card shadow-sm border-0 p-4 mb-4">

    <h4 class="mb-3">Cadastrar sacola surpresa</h4>

    <form th:action="@{/admin/food-to-save/salvar}" method="post">

      <div class="row g-3">

        <div class="col-md-6">
          <label class="form-label">Nome da sacola</label>
          <input type="text" name="nome" class="form-control"
                 required>
        </div>

        <div class="col-md-6">
          <label class="form-label">Preço promocional</label>
          <input type="number" name="valor" class="form-control"
                 step="0.01" min="0.01" required>
        </div>

        <div class="col-md-6">
          <label class="form-label">Quantidade disponível</label>
          <input type="number" name="quantidadeDisponivel"
                 class="form-control" min="0" required>
        </div>

        <div class="col-md-6">
          <label class="form-label">Data de validade</label>
          <input type="date" name="dataValidade"
                 class="form-control" required>
        </div>

        <div class="col-12">
          <label class="form-label">Descrição</label>
          <textarea name="descricao" class="form-control"
                    rows="3"
                    placeholder="Exemplo: sacola com pães, doces e salgados variados."
                    required></textarea>
        </div>

        <div class="col-12">
          <button type="submit" class="btn text-white"
                  style="background-color: #5b2f21;">
            Cadastrar sacola
          </button>
        </div>

      </div>

    </form>

  </div>

  <div class="card shadow-sm border-0 p-4">

    <h4 class="mb-3">Sacolas cadastradas</h4>

    <div class="table-responsive">

      <table class="table table-hover align-middle">

        <thead>
        <tr>
          <th>Nome</th>
          <th>Preço</th>
          <th>Quantidade</th>
          <th>Validade</th>
          <th>Ação</th>
        </tr>
        </thead>

        <tbody>

        <tr th:each="sacola : ${sacolas}">

          <td th:text="${sacola.nome}"></td>

          <td th:text="${#numbers.formatCurrency(sacola.valor)}"></td>

          <td th:text="${sacola.quantidadeDisponivel}"></td>

          <td th:text="${#temporals.format(sacola.dataValidade, 'dd/MM/yyyy')}"></td>

          <td>
            <form th:action="@{/admin/food-to-save/excluir/{id}(id=${sacola.id})}"
                  method="post">

              <button type="submit" class="btn btn-sm btn-danger">
                Excluir
              </button>

            </form>
          </td>

        </tr>

        <tr th:if="${#lists.isEmpty(sacolas)}">
          <td colspan="5" class="text-center text-secondary">
            Nenhuma sacola cadastrada.
          </td>
        </tr>

        </tbody>

      </table>

    </div>

  </div>

</main>

<div th:replace="~{fragments/footer :: rodape}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
