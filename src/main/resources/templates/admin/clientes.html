
<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clientes | Pão & Felicidade</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body style="background-color: #fff8ed;">

<div th:replace="~{fragments/header :: cabecalho}"></div>
<div th:replace="~{fragments/mensagens :: mensagens}"></div>

<main class="container py-5">

    <h2 class="fw-bold mb-4" style="color: #5b2f21;">
        Clientes Cadastrados
    </h2>

    <div class="card shadow-sm border-0 p-4">

        <div class="table-responsive">

            <table class="table table-hover align-middle">

                <thead>
                <tr>
                    <th>Nome</th>
                    <th>CPF</th>
                    <th>E-mail</th>
                    <th>Telefone</th>
                    <th>Cidade</th>
                </tr>
                </thead>

                <tbody>

                <tr th:each="cliente : ${clientes}">

                    <td th:text="${cliente.nome}"></td>
                    <td th:text="${cliente.cpf}"></td>
                    <td th:text="${cliente.email}"></td>
                    <td th:text="${cliente.telefone}"></td>
                    <td th:text="${cliente.cidade}"></td>

                </tr>

                <tr th:if="${#lists.isEmpty(clientes)}">
                    <td colspan="5" class="text-center text-secondary">
                        Nenhum cliente cadastrado.
                    </td>
                </tr>

                </tbody>

            </table>

        </div>

    </div>

</main>

<div th:replace="~{fragments/footer :: rodape}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
