
<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedidos | Pão & Felicidade</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body style="background-color: #fff8ed;">

<div th:replace="~{fragments/header :: cabecalho}"></div>
<div th:replace="~{fragments/mensagens :: mensagens}"></div>

<main class="container py-5">

    <h2 class="fw-bold mb-4" style="color: #5b2f21;">
        Pedidos dos Clientes
    </h2>

    <div class="card border-0 shadow-sm p-4">

        <div class="table-responsive">

            <table class="table table-hover align-middle">

                <thead>
                <tr>
                    <th>Número</th>
                    <th>Cliente</th>
                    <th>Data</th>
                    <th>Valor total</th>
                    <th>Status</th>
                    <th>Atualizar</th>
                </tr>
                </thead>

                <tbody>

                <tr th:each="pedido : ${pedidos}">

                    <td th:text="${pedido.id}"></td>

                    <td th:text="${pedido.cliente.nome}"></td>

                    <td th:text="${#temporals.format(pedido.dataPedido, 'dd/MM/yyyy HH:mm')}"></td>

                    <td th:text="${#numbers.formatCurrency(pedido.valorTotal)}"></td>

                    <td>
                        <span class="badge bg-warning text-dark"
                              th:text="${pedido.status}">
                        </span>
                    </td>

                    <td>
                        <form th:action="@{/admin/pedidos/status/{id}(id=${pedido.id})}"
                              method="post">

                            <select name="status" class="form-select form-select-sm mb-2">
                                <option value="EM_PREPARACAO">Em preparação</option>
                                <option value="PRONTO">Pronto</option>
                                <option value="CONCLUIDO">Concluído</option>
                                <option value="CANCELADO">Cancelado</option>
                            </select>

                            <button type="submit" class="btn btn-sm btn-dark">
                                Atualizar
                            </button>

                        </form>
                    </td>

                </tr>

                <tr th:if="${#lists.isEmpty(pedidos)}">
                    <td colspan="6" class="text-center text-secondary">
                        Nenhum pedido encontrado.
                    </td>
                </tr>

                </tbody>

            </table>

        </div>

    </div>

</main>

<div th:replace="~{fragments/footer :: rodape}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
