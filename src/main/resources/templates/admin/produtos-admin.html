
<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerenciar Produtos | Pão & Felicidade</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body style="background-color: #fff8ed;">

<div th:replace="~{fragments/header :: cabecalho}"></div>
<div th:replace="~{fragments/mensagens :: mensagens}"></div>

<main class="container py-5">

  <h2 class="fw-bold mb-4" style="color: #5b2f21;">
    Gerenciar Produtos
  </h2>

  <div class="card shadow-sm border-0 p-4 mb-4">

    <h4 class="mb-3">Cadastrar novo produto</h4>

    <form th:action="@{/admin/produtos/salvar}"
          method="post">

      <div class="row g-3">

        <div class="col-md-6">
          <label class="form-label">Nome do produto</label>
          <input type="text" name="nome" class="form-control"
                 required>
        </div>

        <div class="col-md-6">
          <label class="form-label">Código</label>
          <input type="number" name="codigo" class="form-control"
                 required>
        </div>

        <div class="col-md-6">
          <label class="form-label">Preço (R$)</label>
          <input type="number" name="valor" class="form-control"
                 step="0.01" min="0.01" required>
        </div>

        <div class="col-md-6">
          <label class="form-label">Quantidade em estoque</label>
          <input type="number" name="quantidadeEstoque"
                 class="form-control" min="0" required>
        </div>

        <div class="col-md-6">
          <label class="form-label">Categoria</label>
          <select name="categoriaId" class="form-select" required>
            <option value="">Selecione</option>
            <option th:each="categoria : ${categorias}"
                    th:value="${categoria.id}"
                    th:text="${categoria.nome}">
            </option>
          </select>
        </div>

        <div class="col-md-6">
          <label class="form-label">Imagem (caminho ou URL)</label>
          <input type="text" name="imagem" class="form-control">
        </div>

        <div class="col-12">
          <label class="form-label">Descrição</label>
          <textarea name="descricao" class="form-control"
                    rows="3"></textarea>
        </div>

        <div class="col-12">
          <button type="submit" class="btn text-white"
                  style="background-color: #5b2f21;">
            Cadastrar produto
          </button>
        </div>

      </div>
    </form>
  </div>

  <div class="card shadow-sm border-0 p-4">

    <h4 class="mb-3">Produtos cadastrados</h4>

    <div class="table-responsive">
      <table class="table table-hover align-middle">

        <thead>
        <tr>
          <th>Código</th>
          <th>Produto</th>
          <th>Preço</th>
          <th>Estoque</th>
          <th>Categoria</th>
          <th>Ações</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="produto : ${produtos}">
          <td th:text="${produto.codigo}"></td>
          <td th:text="${produto.nome}"></td>
          <td th:text="${#numbers.formatCurrency(produto.valor)}"></td>
          <td th:text="${produto.quantidadeEstoque}"></td>
          <td th:text="${produto.categoria != null ? produto.categoria.nome : 'Sem categoria'}"></td>

          <td>
            <form th:action="@{/admin/produtos/excluir/{id}(id=${produto.id})}"
                  method="post">
              <button type="submit" class="btn btn-sm btn-danger">
                Excluir
              </button>
            </form>
          </td>
        </tr>

        <tr th:if="${#lists.isEmpty(produtos)}">
          <td colspan="6" class="text-center text-secondary">
            Nenhum produto cadastrado.
          </td>
        </tr>
        </tbody>

      </table>
    </div>
  </div>

</main>

<div th:replace="~{fragments/footer :: rodape}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
