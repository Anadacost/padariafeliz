
<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Pão & Felicidade</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #fff8ed; color: #3d2418; }
        .login-box { max-width: 430px; margin: 75px auto; padding: 35px; background: white; border-radius: 15px; box-shadow: 0 4px 18px #0002; }
        .btn-brown { background: #5b2f21; color: white; }
        .btn-brown:hover { background: #713b2a; color: white; }
    </style>
</head>
<body>

<div class="container">
    <div class="login-box">
        <h2 class="text-center mb-2">Pão & Felicidade</h2>
        <h4 class="text-center mb-4">Entrar na sua conta</h4>

        <div th:if="${param.error}" class="alert alert-danger">
            E-mail ou senha incorretos.
        </div>

        <div th:if="${param.logout}" class="alert alert-success">
            Você saiu da sua conta.
        </div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label class="form-label">E-mail</label>
                <input type="email" name="username" class="form-control"
                       placeholder="Digite seu e-mail" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Senha</label>
                <input type="password" name="password" class="form-control"
                       placeholder="Digite sua senha" required>
            </div>

            <button type="submit" class="btn btn-brown w-100">Entrar</button>
        </form>

        <p class="text-center mt-4">
            Ainda não possui cadastro?
            <a th:href="@{/cadastro}">Cadastre-se</a>
        </p>

        <div class="text-center">
            <a th:href="@{/}" class="text-decoration-none">Voltar ao início</a>
        </div>
    </div>
</div>

</body>
</html>
